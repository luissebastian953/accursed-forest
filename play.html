<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sawit Simulator</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#fff6e0" />
    <link rel="icon" href="/icon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/brand/sawit-mark.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preload" href="/fonts/baloo2-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <style>
      /* The boot shell: paints before the engine chunk is parsed, so the page
         has a first contentful paint in the first few hundred milliseconds. */
      html,
      body,
      #app {
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #10151a;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #2f4f2d;
        font-family: 'Baloo 2', ui-rounded, 'Segoe UI Rounded', system-ui, sans-serif;
        color: #4a3320;
      }
      #boot .card {
        background: #fff6e0;
        border: 2px solid #f2e0b0;
        border-radius: 22px;
        box-shadow:
          0 5px 0 #d9c48d,
          0 14px 30px rgb(0 0 0 / 0.25);
        padding: 1.5rem 2rem;
        text-align: center;
        min-width: 16rem;
      }
      #boot h1 {
        font-size: 1.8rem;
        font-weight: 800;
        margin: 0 0 0.25rem;
      }
      #boot p {
        margin: 0;
        font-weight: 700;
        color: #8f7a52;
      }
      #boot .bar {
        height: 0.6rem;
        margin-top: 1rem;
        border-radius: 999px;
        background: #efe1bf;
        overflow: hidden;
      }
      #boot .bar i {
        display: block;
        height: 100%;
        width: 40%;
        border-radius: 999px;
        background: linear-gradient(180deg, #5fd06a, #3faa4c);
        animation: boot-slide 1.1s ease-in-out infinite alternate;
      }
      @keyframes boot-slide {
        from {
          transform: translateX(-30%);
        }
        to {
          transform: translateX(200%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot .bar i {
          animation: none;
          width: 100%;
        }
      }
    </style>
    <script>
      (function () {
        var id = '%VITE_GA_ID%';
        if (!id || id.charAt(0) === '%') return;
        var go = function () {
          var s = document.createElement('script');
          s.async = true;
          s.src = 'https://www.googletagmanager.com/gtag/js?id=' + id;
          document.head.appendChild(s);
          window.dataLayer = window.dataLayer || [];
          window.gtag = function () {
            window.dataLayer.push(arguments);
          };
          window.gtag('js', new Date());
          window.gtag('config', id);
        };
        if ('requestIdleCallback' in window) requestIdleCallback(go, { timeout: 4000 });
        else setTimeout(go, 2000);
      })();
    </script>
  </head>
  <body>
    <div id="boot" data-testid="boot">
      <div class="card">
        <h1>Sawit Simulator</h1>
        <p>Waking the estate…</p>
        <div class="bar"><i></i></div>
      </div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
